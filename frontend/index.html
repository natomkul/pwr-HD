<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliography Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="header-content">
        <h1>Bibliography Manager</h1>
        <button class="btn btn-primary" onclick="openAddModal()">+ Add Entry</button>
    </div>
</header>

<main>
    <div class="toolbar">
        <input type="text" id="searchInput" placeholder="Search by title, author, key, year…" oninput="filterEntries()">
        <span id="entryCount" class="count-badge"></span>
    </div>

    <div class="table-wrapper">
        <table id="entriesTable">
            <thead>
                <tr>
                    <th>Key</th>
                    <th>Type</th>
                    <th>Title</th>
                    <th>Year</th>
                    <th>Authors</th>
                    <th>Publisher / Journal</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="entriesBody"></tbody>
        </table>
        <div id="loadingState" class="empty-state">Loading…</div>
        <div id="emptyState"   class="empty-state" style="display:none">No entries found.</div>
    </div>
</main>

<!-- Add / Edit Modal -->
<div id="modal" class="modal-overlay" style="display:none" onclick="closeModalOnOverlay(event)">
    <div class="modal">
        <div class="modal-header">
            <h2 id="modalTitle">Add Entry</h2>
            <button class="close-btn" onclick="closeModal()" aria-label="Close">×</button>
        </div>
        <form id="entryForm" onsubmit="submitEntry(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label for="bib_key">Bib Key *</label>
                    <input type="text" id="bib_key" required placeholder="e.g. Smith2023">
                </div>
                <div class="form-group">
                    <label for="bib_type">Type *</label>
                    <select id="bib_type" required>
                        <option value="">Select type…</option>
                        <option value="article">Article</option>
                        <option value="book">Book</option>
                        <option value="inproceedings">In Proceedings</option>
                        <option value="inbook">In Book</option>
                        <option value="phdthesis">PhD Thesis</option>
                        <option value="mastersthesis">Master's Thesis</option>
                        <option value="techreport">Tech Report</option>
                        <option value="misc">Misc</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <label for="title">Title</label>
                    <input type="text" id="title" placeholder="Publication title">
                </div>
                <div class="form-group">
                    <label for="year">Year</label>
                    <input type="number" id="year" min="1000" max="2100" placeholder="e.g. 2023">
                </div>
                <div class="form-group">
                    <label for="publisher">Publisher</label>
                    <input type="text" id="publisher" placeholder="Publisher name">
                </div>
                <div class="form-group full-width">
                    <label for="journal">Journal</label>
                    <input type="text" id="journal" placeholder="Journal name">
                </div>
            </div>

            <div class="authors-section">
                <div class="authors-header">
                    <label>Authors</label>
                    <button type="button" class="btn btn-sm btn-secondary" onclick="addAuthorRow()">+ Add Author</button>
                </div>
                <div id="authorsList"></div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="submit" class="btn btn-primary" id="submitBtn">Add</button>
            </div>
        </form>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div id="deleteModal" class="modal-overlay" style="display:none">
    <div class="modal modal-sm">
        <div class="modal-header">
            <h2>Delete Entry</h2>
            <button class="close-btn" onclick="closeDeleteModal()" aria-label="Close">×</button>
        </div>
        <p id="deleteMessage"></p>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
            <button class="btn btn-danger"    onclick="confirmDelete()">Delete</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
